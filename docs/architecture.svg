<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 836" width="1200" height="836" font-family="Segoe UI,Helvetica,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs><rect width="1200" height="836" fill="#ffffff"/><text x="600" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#0f172a">ThermalNet: thermal object detection for a FLIR A50</text><rect x="20" y="52" width="1160" height="212" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".35"/><text x="38" y="78" font-size="14" font-weight="700" fill="#2563eb" letter-spacing=".5">1 · LIVE DETECTION</text><rect x="76" y="116" width="68" height="68" rx="16" fill="#2563eb"/><rect x="90" y="139" width="40" height="26" rx="5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M102 139L106 133H114L118 139" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="110" cy="152" r="7" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">FLIR A50 camera</text><text x="110" y="221" text-anchor="middle" font-size="12.5" fill="#475569">thermal video · 640×480</text><rect x="311" y="116" width="68" height="68" rx="16" fill="#2563eb"/><circle cx="345" cy="150" r="16" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M345 134A16 16 0 0 1 345 166Z" fill="#fff"/><text x="345" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Pre-processing</text><text x="345" y="221" text-anchor="middle" font-size="12.5" fill="#475569">gray · CLAHE · 416×416</text><rect x="556" y="116" width="68" height="68" rx="16" fill="#2563eb"/><path d="M575 138L590 150" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M575 162L590 150" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M605 138L590 150" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M605 162L590 150" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="575" cy="138" r="5" fill="#fff"/><circle cx="575" cy="162" r="5" fill="#fff"/><circle cx="590" cy="150" r="5" fill="#fff"/><circle cx="605" cy="138" r="5" fill="#fff"/><circle cx="605" cy="162" r="5" fill="#fff"/><text x="590" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">ThermalNet</text><text x="590" y="221" text-anchor="middle" font-size="12.5" fill="#475569">11.5M parameters</text><rect x="801" y="116" width="68" height="68" rx="16" fill="#2563eb"/><rect x="818" y="133" width="34" height="34" rx="3" fill="none" stroke="#fff" stroke-width="2.4" stroke-dasharray="5 4"/><path d="M827 150L833 157L845 143" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="835" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Post-processing</text><text x="835" y="221" text-anchor="middle" font-size="12.5" fill="#475569">NMS · edge refine · checks</text><rect x="1046" y="116" width="68" height="68" rx="16" fill="#2563eb"/><rect x="1060" y="134" width="40" height="27" rx="4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M1072 169H1088M1080 161V169" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="1071" y="140" width="12" height="15" fill="none" stroke="#fff" stroke-width="2"/><text x="1080" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Live view</text><text x="1080" y="221" text-anchor="middle" font-size="12.5" fill="#475569">boxes · about 30 FPS</text><path d="M150 150H303" fill="none" stroke="#475569" stroke-width="2.6" marker-end="url(#a)"/><path d="M385 150H548" fill="none" stroke="#475569" stroke-width="2.6" marker-end="url(#a)"/><path d="M630 150H793" fill="none" stroke="#475569" stroke-width="2.6" marker-end="url(#a)"/><path d="M875 150H1038" fill="none" stroke="#475569" stroke-width="2.6" marker-end="url(#a)"/><text x="38" y="252" font-size="12" font-style="italic" fill="#475569">The camera's visual (RGB) mode uses a separate YOLOv8n. ThermalNet handles the thermal (IR) mode.</text><rect x="20" y="282" width="1160" height="186" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-opacity=".35"/><text x="38" y="308" font-size="14" font-weight="700" fill="#7c3aed" letter-spacing=".5">2 · INSIDE THERMALNET (BUILT FROM SCRATCH, NO PRETRAINED WEIGHTS)</text><rect x="171" y="338" width="68" height="68" rx="16" fill="#7c3aed"/><path d="M187 382L197 362L205 380L213 360L223 380" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="205" y="426" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Edge detector</text><text x="205" y="443" text-anchor="middle" font-size="12.5" fill="#475569">Sobel · Laplacian · heat contrast</text><rect x="431" y="338" width="68" height="68" rx="16" fill="#7c3aed"/><path d="M465 356L483 365L465 374L447 365Z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M447 373L465 382L483 373" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M447 381L465 390L483 381" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="465" y="426" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Backbone</text><text x="465" y="443" text-anchor="middle" font-size="12.5" fill="#475569">residual CNN + ThermalAttention</text><rect x="691" y="338" width="68" height="68" rx="16" fill="#7c3aed"/><path d="M725 354L744 387H706Z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M718 366H732M712 377H738" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="725" y="426" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Feature pyramid</text><text x="725" y="443" text-anchor="middle" font-size="12.5" fill="#475569">3 scales: 52 · 26 · 13 grid</text><rect x="951" y="338" width="68" height="68" rx="16" fill="#7c3aed"/><circle cx="985" cy="372" r="15" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="985" cy="372" r="5" fill="#fff"/><path d="M985 351V361M985 383V393M964 372H974M996 372H1006" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="985" y="426" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Detection heads</text><text x="985" y="443" text-anchor="middle" font-size="12.5" fill="#475569">objectness · box · 19 classes</text><path d="M48 372H163" fill="none" stroke="#7c3aed" stroke-width="2.6" marker-end="url(#a)"/><text x="100" y="362" text-anchor="middle" font-size="12.5" font-style="italic" fill="#7c3aed">IR frame</text><path d="M245 372H423" fill="none" stroke="#475569" stroke-width="2.6" marker-end="url(#a)"/><path d="M505 372H683" fill="none" stroke="#475569" stroke-width="2.6" marker-end="url(#a)"/><path d="M765 372H943" fill="none" stroke="#475569" stroke-width="2.6" marker-end="url(#a)"/><text x="335" y="362" text-anchor="middle" font-size="12.5" font-style="italic" fill="#7c3aed">1 gray + 8 edge channels</text><rect x="20" y="486" width="1160" height="318" rx="18" fill="#ecfdf5" stroke="#059669" stroke-opacity=".35"/><text x="38" y="512" font-size="14" font-weight="700" fill="#059669" letter-spacing=".5">3 · DATA AND TRAINING (RUNS WHEN THE MODEL IS RETRAINED)</text><rect x="86" y="532" width="68" height="68" rx="16" fill="#059669"/><ellipse cx="120" cy="555" rx="16" ry="6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M104 555V577A16 6 0 0 0 136 577V555" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M104 566A16 6 0 0 0 136 566" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="620" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Public IR datasets</text><text x="120" y="637" text-anchor="middle" font-size="12.5" fill="#475569">FLIR · LLVIP · SDT · HIT-UAV</text><rect x="316" y="532" width="68" height="68" rx="16" fill="#059669"/><path d="M334 560H362M356 554L362 560L356 566" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M366 574H338M344 568L338 574L344 580" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="350" y="620" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Convert</text><text x="350" y="637" text-anchor="middle" font-size="12.5" fill="#475569">8-bit gray + box labels</text><rect x="86" y="684" width="68" height="68" rx="16" fill="#059669"/><rect x="101" y="703" width="38" height="30" rx="4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M101 728L114 716L124 726L130 720L139 728" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="128" cy="711" r="3" fill="#fff"/><text x="120" y="772" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Own frames</text><text x="120" y="789" text-anchor="middle" font-size="12.5" fill="#475569">451 person + 213 objects</text><rect x="316" y="684" width="68" height="68" rx="16" fill="#059669"/><path d="M334 702H352L367 717L351 733L334 716Z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="343" cy="711" r="2.6" fill="#fff"/><text x="350" y="772" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Labels</text><text x="350" y="789" text-anchor="middle" font-size="12.5" fill="#475569">hand (person) · auto (objects)</text><rect x="586" y="608" width="68" height="68" rx="16" fill="#059669"/><path d="M602 626V658H638" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M608 630Q614 650 635 651" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="620" y="696" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Two-stage training</text><text x="620" y="713" text-anchor="middle" font-size="12.5" fill="#475569">pretrain → fine-tune</text><rect x="806" y="608" width="68" height="68" rx="16" fill="#059669"/><path d="M826 658V644M838 658V636M850 658V627" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><text x="840" y="696" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Scene-based test</text><text x="840" y="713" text-anchor="middle" font-size="12.5" fill="#475569">AP · precision · recall</text><rect x="1016" y="608" width="68" height="68" rx="16" fill="#059669"/><path d="M1037 624H1055L1064 633V660H1037Z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M1044 644L1049 650L1058 639" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="1050" y="696" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Best weights (v2)</text><text x="1050" y="713" text-anchor="middle" font-size="12.5" fill="#475569">person AP 1.00 on own test</text><path d="M160 566H308" fill="none" stroke="#475569" stroke-width="2.6" marker-end="url(#a)"/><path d="M160 718H308" fill="none" stroke="#475569" stroke-width="2.6" marker-end="url(#a)"/><path d="M388 570L576 628" fill="none" stroke="#475569" stroke-width="2.6" marker-end="url(#a)"/><path d="M388 714L576 656" fill="none" stroke="#475569" stroke-width="2.6" marker-end="url(#a)"/><text x="450" y="556" text-anchor="middle" font-size="12.5" font-style="italic" fill="#059669">34k images</text><text x="462" y="730" text-anchor="middle" font-size="12.5" font-style="italic" fill="#059669">15% of every epoch</text><path d="M660 642H798" fill="none" stroke="#475569" stroke-width="2.6" marker-end="url(#a)"/><path d="M880 642H1008" fill="none" stroke="#475569" stroke-width="2.6" marker-end="url(#a)"/><circle cx="876" cy="606" r="12" fill="#fff" stroke="#059669" stroke-width="2.4"/><path d="M870 606L874 610L882 601" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M1088 642H1158V98H590V114" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#a)"/><text x="880" y="91" text-anchor="middle" font-size="12.5" font-style="italic" fill="#059669">the live view loads the best weights</text><text x="600" y="826" text-anchor="middle" font-size="12.5" fill="#475569">Arrows: data flow · band 2 is what happens inside the ThermalNet box · ✓ = tested on held-out scenes</text></svg>